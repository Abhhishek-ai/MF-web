<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <defs>
    <linearGradient id="bgNamkeen" x1="0" y1="0" x2="600" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#854D0E"/>
      <stop offset="50%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <radialGradient id="namkeenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#854D0E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bgNamkeen)"/>
  <circle cx="300" cy="225" r="210" fill="url(#namkeenGlow)"/>
  <g transform="translate(160, 70)">
    <!-- Namkeen Retail Pouch -->
    <path d="M70 40 L210 40 L220 220 L60 220 Z" fill="#DC2626"/>
    <!-- Metallic seal top -->
    <rect x="65" y="30" width="150" height="15" rx="3" fill="#FDE047"/>
    <!-- Pouch window showing yellow bhujia -->
    <circle cx="140" cy="140" r="45" fill="#FEF08A" stroke="#FDE047" stroke-width="4"/>
    <!-- Sev strands inside window -->
    <path d="M120 125 Q140 130 160 125" stroke="#CA8A04" stroke-width="3" fill="none"/>
    <path d="M115 140 Q135 145 165 140" stroke="#CA8A04" stroke-width="3" fill="none"/>
    <path d="M120 155 Q140 160 160 155" stroke="#CA8A04" stroke-width="3" fill="none"/>
    <!-- Brand on pouch -->
    <text x="140" y="80" font-family="-apple-system, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle">BIKAJI &amp; HALDIRAM</text>
    <text x="140" y="100" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" fill="#FEF08A" text-anchor="middle">BHUJIA SEV</text>
  </g>
  <!-- Title label overlay -->
  <rect x="40" y="360" width="520" height="60" rx="14" fill="#0B1B3F" fill-opacity="0.85"/>
  <text x="70" y="398" font-family="-apple-system, sans-serif" font-weight="800" font-size="22" fill="#FFFFFF">Indian Namkeen &amp; Bhujia</text>
  <text x="530" y="398" font-family="-apple-system, sans-serif" font-weight="600" font-size="14" fill="#FEF08A" text-anchor="end">Ratlami Sev • Aloo Bhujia</text>
</svg>
