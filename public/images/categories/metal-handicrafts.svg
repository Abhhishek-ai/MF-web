<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <defs>
    <linearGradient id="bgMetal" x1="0" y1="0" x2="600" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <radialGradient id="metalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#312E81" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bgMetal)"/>
  <circle cx="300" cy="200" r="180" fill="url(#metalGlow)"/>
  <g transform="translate(180, 60)">
    <!-- Traditional Metal Peacock Artifact -->
    <ellipse cx="120" cy="150" rx="45" ry="30" fill="#CA8A04"/>
    <path d="M140 130 C160 100 130 60 110 50 C120 70 120 90 110 130 Z" fill="#EAB308"/>
    <!-- Crown feather -->
    <circle cx="105" cy="40" r="6" fill="#FDE047"/>
    <!-- Tail Feathers Fan -->
    <path d="M80 150 C50 110 40 70 80 40 C70 80 75 110 90 140 Z" fill="#F59E0B"/>
    <path d="M70 160 C30 130 10 90 40 60 C40 100 50 130 75 155 Z" fill="#D97706"/>
    <!-- Stand -->
    <ellipse cx="120" cy="210" rx="60" ry="16" fill="#A16207"/>
    <rect x="112" y="170" width="16" height="42" fill="#CA8A04"/>
  </g>
  <!-- Sparkles -->
  <path d="M120 80 L125 65 L130 80 L145 85 L130 90 L125 105 L120 90 L105 85 Z" fill="#FEF08A"/>
  <!-- Title label overlay -->
  <rect x="40" y="360" width="520" height="60" rx="14" fill="#0B1B3F" fill-opacity="0.85"/>
  <text x="70" y="398" font-family="-apple-system, sans-serif" font-weight="800" font-size="22" fill="#FFFFFF">Traditional Metal Handicrafts</text>
  <text x="530" y="398" font-family="-apple-system, sans-serif" font-weight="600" font-size="14" fill="#FDE047" text-anchor="end">Peacock • Statues • Decor</text>
</svg>
