<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1B3F"/>
      <stop offset="50%" stop-color="#1B4FD8"/>
      <stop offset="100%" stop-color="#F6F8FC"/>
    </linearGradient>
    <linearGradient id="seaGrad" x1="0" y1="360" x2="0" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="containerGrad" x1="0" y1="0" x2="400" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B4FD8"/>
      <stop offset="100%" stop-color="#0B1B3F"/>
    </linearGradient>
  </defs>

  <!-- Background Sky & Sea -->
  <rect width="640" height="380" fill="url(#skyGrad)"/>
  <rect y="380" width="640" height="100" fill="url(#seaGrad)"/>

  <!-- Distant Cargo Ship Silhouettes -->
  <path d="M480 375 L560 375 L550 365 L510 365 Z" fill="#0B1B3F" opacity="0.4"/>
  <rect x="520" y="352" width="15" height="13" fill="#0B1B3F" opacity="0.4"/>

  <!-- Main 40ft Consolidated Container Isometric Graphic -->
  <g transform="translate(60, 110)">
    <!-- Container Body -->
    <path d="M80 60 L440 60 L500 120 L500 280 L140 280 L80 220 Z" fill="#09142E" opacity="0.3"/>
    
    <!-- Front/Side Face -->
    <rect x="60" y="70" width="380" height="170" rx="10" fill="url(#containerGrad)" stroke="#3B82F6" stroke-width="2"/>
    
    <!-- Corrugated Container Ribs -->
    <g stroke="#2563EB" stroke-width="3" opacity="0.7">
      <line x1="90" y1="75" x2="90" y2="235"/>
      <line x1="120" y1="75" x2="120" y2="235"/>
      <line x1="150" y1="75" x2="150" y2="235"/>
      <line x1="180" y1="75" x2="180" y2="235"/>
      <line x1="210" y1="75" x2="210" y2="235"/>
      <line x1="240" y1="75" x2="240" y2="235"/>
      <line x1="270" y1="75" x2="270" y2="235"/>
      <line x1="300" y1="75" x2="300" y2="235"/>
      <line x1="330" y1="75" x2="330" y2="235"/>
      <line x1="360" y1="75" x2="360" y2="235"/>
      <line x1="390" y1="75" x2="390" y2="235"/>
      <line x1="420" y1="75" x2="420" y2="235"/>
    </g>

    <!-- Branding Plate -->
    <rect x="130" y="100" width="240" height="90" rx="8" fill="#FFFFFF" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.3))"/>
    <text x="250" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24" fill="#0B1B3F" text-anchor="middle" letter-spacing="2">MEGH FOODS</text>
    <text x="250" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="11" fill="#1B4FD8" text-anchor="middle" letter-spacing="1">EXPORT CONSOLIDATION HUB</text>
    <text x="250" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="9.5" fill="#15803D" text-anchor="middle">AHMEDABAD &amp; CHANGODAR • INDIA</text>

    <!-- Corner Castings -->
    <rect x="62" y="72" width="16" height="16" rx="2" fill="#93C5FD"/>
    <rect x="422" y="72" width="16" height="16" rx="2" fill="#93C5FD"/>
    <rect x="62" y="222" width="16" height="16" rx="2" fill="#93C5FD"/>
    <rect x="422" y="222" width="16" height="16" rx="2" fill="#93C5FD"/>

    <!-- Spec labels -->
    <rect x="75" y="80" width="45" height="18" rx="3" fill="#0B1B3F" opacity="0.8"/>
    <text x="97" y="93" font-family="monospace" font-size="9" fill="#9CCB3B" text-anchor="middle" font-weight="bold">40FT HC</text>

    <!-- Pallets in front -->
    <g transform="translate(10, 200)">
      <!-- Pallet 1: Basmati Rice & Flours -->
      <rect x="0" y="10" width="70" height="40" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
      <rect x="5" y="15" width="60" height="15" rx="2" fill="#D97706"/>
      <text x="35" y="26" font-family="sans-serif" font-weight="bold" font-size="7" fill="#FFFFFF" text-anchor="middle">BASMATI RICE</text>
      <rect x="5" y="32" width="60" height="14" rx="2" fill="#1B4FD8"/>
      <text x="35" y="42" font-family="sans-serif" font-weight="bold" font-size="7" fill="#FFFFFF" text-anchor="middle">CHAKKI AATA</text>
      <!-- Wood Pallet base -->
      <rect x="-2" y="52" width="74" height="8" rx="2" fill="#B45309"/>
    </g>

    <g transform="translate(420, 200)">
      <!-- Pallet 2: FMCG & Snacks -->
      <rect x="0" y="10" width="70" height="40" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
      <rect x="5" y="15" width="60" height="15" rx="2" fill="#DC2626"/>
      <text x="35" y="26" font-family="sans-serif" font-weight="bold" font-size="7" fill="#FFFFFF" text-anchor="middle">PARLE &amp; BIKAJI</text>
      <rect x="5" y="32" width="60" height="14" rx="2" fill="#047857"/>
      <text x="35" y="42" font-family="sans-serif" font-weight="bold" font-size="7" fill="#FFFFFF" text-anchor="middle">SPICES &amp; DALS</text>
      <!-- Wood Pallet base -->
      <rect x="-2" y="52" width="74" height="8" rx="2" fill="#B45309"/>
    </g>
  </g>

  <!-- Destination Port Badges floating -->
  <g transform="translate(40, 25)">
    <rect x="0" y="0" width="130" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.95" stroke="#E2E8F0"/>
    <text x="65" y="22" font-family="-apple-system, sans-serif" font-weight="bold" font-size="12" fill="#0B1B3F" text-anchor="middle">🇺🇸 USA • 🇬🇧 UK • 🇦🇪 UAE</text>
  </g>
  <g transform="translate(460, 25)">
    <rect x="0" y="0" width="140" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.95" stroke="#E2E8F0"/>
    <text x="70" y="22" font-family="-apple-system, sans-serif" font-weight="bold" font-size="12" fill="#0B1B3F" text-anchor="middle">🇨🇦 CAN • 🇦🇺 AUS • 🇸🇬 SGP</text>
  </g>
</svg>
