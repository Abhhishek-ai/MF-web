<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Sky Gradient: rich morning maritime dawn -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1E3D"/>
      <stop offset="25%" stop-color="#153666"/>
      <stop offset="50%" stop-color="#1E4D8C"/>
      <stop offset="72%" stop-color="#F59E0B"/>
      <stop offset="85%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>

    <!-- Ocean Water Gradient -->
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="30%" stop-color="#0369A1"/>
      <stop offset="70%" stop-color="#0F4C81"/>
      <stop offset="100%" stop-color="#0A2540"/>
    </linearGradient>

    <!-- Water Sun Reflection -->
    <linearGradient id="waterGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0"/>
    </linearGradient>

    <!-- Horizon Sun Glow -->
    <radialGradient id="sunHorizon" cx="65%" cy="62%" r="40%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.95"/>
      <stop offset="20%" stop-color="#FDE68A" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1E4D8C" stop-opacity="0"/>
    </radialGradient>

    <!-- World Map Grid Pattern -->
    <pattern id="coordGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#60A5FA" stroke-width="0.5" stroke-dasharray="3 3" opacity="0.25"/>
    </pattern>

    <!-- Container Shading -->
    <linearGradient id="cRed" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#B91C1C"/><stop offset="100%" stop-color="#EF4444"/></linearGradient>
    <linearGradient id="cBlue" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1D4ED8"/><stop offset="100%" stop-color="#3B82F6"/></linearGradient>
    <linearGradient id="cGreen" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#047857"/><stop offset="100%" stop-color="#10B981"/></linearGradient>
    <linearGradient id="cOrange" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#C2410C"/><stop offset="100%" stop-color="#F97316"/></linearGradient>
    <linearGradient id="cYellow" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#D97706"/><stop offset="100%" stop-color="#FBBF24"/></linearGradient>
    <linearGradient id="cCyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0891B2"/><stop offset="100%" stop-color="#06B6D4"/></linearGradient>

    <!-- Crane Orange Gradient -->
    <linearGradient id="craneOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>

    <!-- Ship Hull Gradient -->
    <linearGradient id="hullGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="65%" stop-color="#0F172A"/>
      <stop offset="68%" stop-color="#991B1B"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>

    <!-- Quayside Dock Gradient -->
    <linearGradient id="dockGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="25%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <!-- SKY BACKGROUND -->
  <rect x="0" y="0" width="1920" height="660" fill="url(#skyGrad)"/>

  <!-- HORIZON GLOW -->
  <rect x="0" y="300" width="1920" height="360" fill="url(#sunHorizon)"/>

  <!-- GLOBAL NAV COORDINATE GRID (Trade routes vibe) -->
  <rect x="0" y="0" width="1920" height="660" fill="url(#coordGrid)"/>

  <!-- WORLD TRADE FLIGHT / CARGO ARCS -->
  <g stroke="#38BDF8" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" fill="none">
    <path d="M 850 560 Q 600 240 250 400"/>
    <path d="M 850 560 Q 750 180 480 280"/>
    <path d="M 850 560 Q 1100 260 1450 350"/>
    <path d="M 850 560 Q 1300 280 1750 420"/>
    <path d="M 850 560 Q 1050 420 1200 480"/>
  </g>

  <!-- TRADE ROUTE WAYPOINT PINGS -->
  <g fill="#38BDF8">
    <circle cx="850" cy="560" r="7" fill="#F59E0B"/>
    <circle cx="850" cy="560" r="14" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.75"/>
    <circle cx="250" cy="400" r="5"/>
    <circle cx="480" cy="280" r="5"/>
    <circle cx="1200" cy="480" r="5"/>
    <circle cx="1450" cy="350" r="5"/>
    <circle cx="1750" cy="420" r="5"/>
  </g>

  <!-- DISTANT SILHOUETTES & MOUNTAINS / SHORELINE -->
  <path d="M0 640 Q 250 610 500 635 T 1000 620 T 1500 635 T 1920 625 L 1920 660 L 0 660 Z" fill="#1E3A5F" opacity="0.6"/>

  <!-- OCEAN WATER -->
  <rect x="0" y="640" width="1920" height="440" fill="url(#oceanGrad)"/>

  <!-- SUNLIGHT REFLECTION ON WATER -->
  <polygon points="1200,640 1350,640 1500,1080 1000,1080" fill="url(#waterGlow)"/>

  <!-- WATER SURFACE RIPPLES -->
  <g stroke="#7DD3FC" stroke-width="1" opacity="0.4">
    <line x1="100" y1="670" x2="350" y2="670"/>
    <line x1="450" y1="685" x2="800" y2="685"/>
    <line x1="900" y1="665" x2="1150" y2="665"/>
    <line x1="1250" y1="680" x2="1600" y2="680"/>
    <line x1="200" y1="720" x2="600" y2="720"/>
    <line x1="750" y1="735" x2="1300" y2="735"/>
    <line x1="1400" y1="715" x2="1850" y2="715"/>
    <line x1="300" y1="800" x2="900" y2="800" stroke-width="1.5"/>
    <line x1="1050" y1="790" x2="1700" y2="790" stroke-width="1.5"/>
    <line x1="150" y1="880" x2="850" y2="880" stroke-width="2"/>
    <line x1="950" y1="870" x2="1800" y2="870" stroke-width="2"/>
  </g>

  <!-- ==================== CONTAINER CARGO SHIP (Right/Center) ==================== -->
  <g transform="translate(680, 480)">
    <!-- Ship Hull -->
    <path d="M 80 180 L 150 250 L 760 250 L 840 210 L 850 170 L 60 170 Z" fill="url(#hullGrad)"/>
    <!-- Hull White Draft Line & Red Antifouling -->
    <line x1="140" y1="230" x2="775" y2="230" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
    <!-- Anchor Port & Bulbous Bow Glow -->
    <circle cx="110" cy="200" r="4" fill="#0F172A" stroke="#475569" stroke-width="2"/>

    <!-- Ship Bridge / Superstructure (Rear/Aft) -->
    <rect x="650" y="70" width="100" height="100" rx="3" fill="#F8FAFC"/>
    <rect x="665" y="40" width="70" height="30" rx="2" fill="#E2E8F0"/>
    <rect x="675" y="20" width="50" height="20" rx="2" fill="#CBD5E1"/>
    <!-- Radar Mast & Antennas -->
    <line x1="700" y1="20" x2="700" y2="-10" stroke="#475569" stroke-width="3"/>
    <line x1="685" y1="5" x2="715" y2="5" stroke="#475569" stroke-width="2"/>
    <line x1="690" y1="-5" x2="710" y2="-5" stroke="#475569" stroke-width="2"/>
    <!-- Bridge Windows -->
    <rect x="670" y="46" width="60" height="8" rx="1" fill="#0284C7"/>
    <rect x="655" y="78" width="90" height="6" rx="1" fill="#0284C7"/>
    <!-- Exhaust Funnel (Navy/Orange Megh colors) -->
    <rect x="730" y="30" width="22" height="45" rx="3" fill="#1B4FD8"/>
    <rect x="730" y="30" width="22" height="10" rx="2" fill="#F97316"/>

    <!-- STACKS OF SHIPPING CONTAINERS ON BOARD -->
    <!-- Tier 1 (Bottom) -->
    <rect x="120" y="145" width="80" height="25" rx="2" fill="url(#cBlue)" stroke="#1E3A8A" stroke-width="1"/>
    <rect x="205" y="145" width="80" height="25" rx="2" fill="url(#cRed)" stroke="#7F1D1D" stroke-width="1"/>
    <rect x="290" y="145" width="80" height="25" rx="2" fill="url(#cGreen)" stroke="#064E3B" stroke-width="1"/>
    <rect x="375" y="145" width="80" height="25" rx="2" fill="url(#cOrange)" stroke="#7C2D12" stroke-width="1"/>
    <rect x="460" y="145" width="80" height="25" rx="2" fill="url(#cYellow)" stroke="#78350F" stroke-width="1"/>
    <rect x="545" y="145" width="80" height="25" rx="2" fill="url(#cCyan)" stroke="#164E63" stroke-width="1"/>

    <!-- Tier 2 -->
    <rect x="130" y="118" width="80" height="25" rx="2" fill="url(#cGreen)" stroke="#064E3B" stroke-width="1"/>
    <rect x="215" y="118" width="80" height="25" rx="2" fill="url(#cBlue)" stroke="#1E3A8A" stroke-width="1"/>
    <rect x="300" y="118" width="80" height="25" rx="2" fill="url(#cOrange)" stroke="#7C2D12" stroke-width="1"/>
    <rect x="385" y="118" width="80" height="25" rx="2" fill="url(#cRed)" stroke="#7F1D1D" stroke-width="1"/>
    <rect x="470" y="118" width="80" height="25" rx="2" fill="url(#cBlue)" stroke="#1E3A8A" stroke-width="1"/>
    <rect x="555" y="118" width="75" height="25" rx="2" fill="url(#cYellow)" stroke="#78350F" stroke-width="1"/>

    <!-- Tier 3 -->
    <rect x="145" y="91" width="80" height="25" rx="2" fill="url(#cOrange)" stroke="#7C2D12" stroke-width="1"/>
    <rect x="230" y="91" width="80" height="25" rx="2" fill="url(#cYellow)" stroke="#78350F" stroke-width="1"/>
    <rect x="315" y="91" width="80" height="25" rx="2" fill="url(#cBlue)" stroke="#1E3A8A" stroke-width="1"/>
    <rect x="400" y="91" width="80" height="25" rx="2" fill="url(#cGreen)" stroke="#064E3B" stroke-width="1"/>
    <rect x="485" y="91" width="80" height="25" rx="2" fill="url(#cCyan)" stroke="#164E63" stroke-width="1"/>

    <!-- Tier 4 (Top row) -->
    <rect x="240" y="64" width="80" height="25" rx="2" fill="url(#cRed)" stroke="#7F1D1D" stroke-width="1"/>
    <rect x="325" y="64" width="80" height="25" rx="2" fill="url(#cBlue)" stroke="#1E3A8A" stroke-width="1"/>
    <rect x="410" y="64" width="80" height="25" rx="2" fill="url(#cOrange)" stroke="#7C2D12" stroke-width="1"/>
  </g>

  <!-- ==================== PORT TERMINAL & CRANES (Far Right) ==================== -->
  <!-- Quayside Quay -->
  <polygon points="1450,650 1920,650 1920,850 1420,850" fill="url(#dockGrad)"/>
  <line x1="1450" y1="650" x2="1920" y2="650" stroke="#F59E0B" stroke-width="4"/>

  <!-- Dockside Container Stacks -->
  <g transform="translate(1500, 560)">
    <rect x="20" y="55" width="70" height="30" rx="2" fill="url(#cBlue)"/>
    <rect x="95" y="55" width="70" height="30" rx="2" fill="url(#cOrange)"/>
    <rect x="170" y="55" width="70" height="30" rx="2" fill="url(#cGreen)"/>
    <rect x="245" y="55" width="70" height="30" rx="2" fill="url(#cRed)"/>
    <rect x="320" y="55" width="70" height="30" rx="2" fill="url(#cYellow)"/>

    <rect x="45" y="23" width="70" height="30" rx="2" fill="url(#cRed)"/>
    <rect x="120" y="23" width="70" height="30" rx="2" fill="url(#cYellow)"/>
    <rect x="195" y="23" width="70" height="30" rx="2" fill="url(#cBlue)"/>
    <rect x="270" y="23" width="70" height="30" rx="2" fill="url(#cGreen)"/>

    <rect x="70" y="-9" width="70" height="30" rx="2" fill="url(#cCyan)"/>
    <rect x="145" y="-9" width="70" height="30" rx="2" fill="url(#cOrange)"/>
    <rect x="220" y="-9" width="70" height="30" rx="2" fill="url(#cBlue)"/>
  </g>

  <!-- GIANT STS GANTRY CRANE 1 (Front/Prominent) -->
  <g transform="translate(1380, 200)">
    <!-- Main A-Frame Legs -->
    <line x1="120" y1="450" x2="200" y2="80" stroke="url(#craneOrange)" stroke-width="12" stroke-linecap="round"/>
    <line x1="280" y1="450" x2="200" y2="80" stroke="url(#craneOrange)" stroke-width="12" stroke-linecap="round"/>
    <line x1="150" y1="450" x2="230" y2="80" stroke="#C2410C" stroke-width="8" stroke-linecap="round"/>
    <line x1="310" y1="450" x2="230" y2="80" stroke="#C2410C" stroke-width="8" stroke-linecap="round"/>

    <!-- Cross Bracing -->
    <line x1="140" y1="360" x2="295" y2="360" stroke="#EA580C" stroke-width="6"/>
    <line x1="160" y1="260" x2="275" y2="260" stroke="#EA580C" stroke-width="6"/>
    <line x1="180" y1="160" x2="255" y2="160" stroke="#EA580C" stroke-width="6"/>
    <line x1="140" y1="360" x2="275" y2="260" stroke="#EA580C" stroke-width="4"/>
    <line x1="295" y1="360" x2="160" y2="260" stroke="#EA580C" stroke-width="4"/>
    <line x1="160" y1="260" x2="255" y2="160" stroke="#EA580C" stroke-width="4"/>
    <line x1="275" y1="260" x2="180" y2="160" stroke="#EA580C" stroke-width="4"/>

    <!-- Upper Tower Frame -->
    <polygon points="170,80 260,80 230,-40 200,-40" fill="#EA580C"/>

    <!-- Crane Boom Jib (Extending over ship water) -->
    <rect x="-180" y="60" width="550" height="20" rx="3" fill="#EA580C"/>
    <line x1="-180" y1="70" x2="370" y2="70" stroke="#FDBA74" stroke-width="3"/>
    
    <!-- Tension Cables to Tower Top -->
    <line x1="215" y1="-40" x2="-160" y2="60" stroke="#94A3B8" stroke-width="3"/>
    <line x1="215" y1="-40" x2="-40" y2="60" stroke="#94A3B8" stroke-width="3"/>
    <line x1="215" y1="-40" x2="350" y2="60" stroke="#94A3B8" stroke-width="3"/>

    <!-- Trolley & Spreader Hoisting a Container -->
    <rect x="-30" y="80" width="40" height="15" rx="2" fill="#1E293B"/>
    <line x1="-20" y1="95" x2="-20" y2="170" stroke="#475569" stroke-width="2"/>
    <line x1="0" y1="95" x2="0" y2="170" stroke="#475569" stroke-width="2"/>
    <!-- Spreader Bar -->
    <rect x="-35" y="170" width="50" height="8" rx="2" fill="#EAB308"/>
    <!-- Container in Air -->
    <rect x="-45" y="178" width="70" height="26" rx="2" fill="url(#cBlue)" stroke="#1E3A8A" stroke-width="1.5"/>

    <!-- Crane Cabin & Floodlight Glow -->
    <rect x="170" y="85" width="25" height="20" rx="2" fill="#F8FAFC"/>
    <circle cx="182" cy="95" r="4" fill="#FACC15"/>
    <polygon points="-30,95 -100,320 40,320" fill="#FEF08A" opacity="0.15"/>
  </g>

  <!-- GANTRY CRANE 2 (Mid-ground) -->
  <g transform="translate(1620, 240) scale(0.85)">
    <line x1="120" y1="450" x2="200" y2="80" stroke="url(#craneOrange)" stroke-width="12"/>
    <line x1="280" y1="450" x2="200" y2="80" stroke="url(#craneOrange)" stroke-width="12"/>
    <line x1="140" y1="360" x2="295" y2="360" stroke="#EA580C" stroke-width="6"/>
    <line x1="160" y1="260" x2="275" y2="260" stroke="#EA580C" stroke-width="6"/>
    <rect x="-140" y="60" width="500" height="18" fill="#EA580C"/>
    <line x1="215" y1="-30" x2="-120" y2="60" stroke="#94A3B8" stroke-width="2.5"/>
    <line x1="215" y1="-30" x2="340" y2="60" stroke="#94A3B8" stroke-width="2.5"/>
    <polygon points="-10,85 -80,300 60,300" fill="#FEF08A" opacity="0.12"/>
  </g>

  <!-- GANTRY CRANE 3 (Distance/Far) -->
  <g transform="translate(1800, 290) scale(0.65)" opacity="0.85">
    <line x1="120" y1="450" x2="200" y2="80" stroke="#C2410C" stroke-width="12"/>
    <line x1="280" y1="450" x2="200" y2="80" stroke="#C2410C" stroke-width="12"/>
    <rect x="-120" y="60" width="450" height="16" fill="#C2410C"/>
    <line x1="215" y1="-20" x2="-100" y2="60" stroke="#94A3B8" stroke-width="2"/>
    <line x1="215" y1="-20" x2="300" y2="60" stroke="#94A3B8" stroke-width="2"/>
  </g>

  <!-- ==================== LEFT SIDE MARITIME / GLOBAL VIGNETTE ==================== -->
  <!-- Subtle Nautical Compass Rose in Left Sky -->
  <g transform="translate(320, 260)" opacity="0.25">
    <circle cx="0" cy="0" r="160" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="130" fill="none" stroke="#60A5FA" stroke-width="1"/>
    <polygon points="0,-160 12,-30 0,0 -12,-30" fill="#3B82F6"/>
    <polygon points="0,160 12,30 0,0 -12,30" fill="#1D4ED8"/>
    <polygon points="-160,0 -30,-12 0,0 -30,12" fill="#1D4ED8"/>
    <polygon points="160,0 30,-12 0,0 30,12" fill="#3B82F6"/>
    <circle cx="0" cy="0" r="8" fill="#F59E0B"/>
  </g>

  <!-- TUG BOAT ESCORTING THE VESSEL (Left-center foreground water) -->
  <g transform="translate(520, 680) scale(0.65)">
    <!-- Tug Hull -->
    <path d="M 20 50 L 50 85 L 170 85 L 190 60 L 10 50 Z" fill="#0F172A"/>
    <line x1="30" y1="70" x2="180" y2="70" stroke="#EF4444" stroke-width="3"/>
    <!-- Tug Cabin -->
    <rect x="70" y="15" width="55" height="35" rx="3" fill="#F8FAFC"/>
    <rect x="75" y="20" width="45" height="10" rx="1" fill="#0284C7"/>
    <rect x="90" y="-5" width="14" height="20" rx="2" fill="#EA580C"/>
    <!-- Water Wake -->
    <path d="M 0 75 Q -50 85 -120 95" stroke="#BAE6FD" stroke-width="3" fill="none" opacity="0.6"/>
    <path d="M 190 75 Q 230 85 280 90" stroke="#BAE6FD" stroke-width="3" fill="none" opacity="0.6"/>
  </g>
</svg>
